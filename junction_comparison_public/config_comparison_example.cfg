# Junction comparison config example
# Copy and adapt this file for your own analysis.
#
# NOTE: StringTie 3.0 cannot parse gzipped RefSeq GTFs (reads as binary).
# lnc-seeker requires BGZF-compressed GTF. Use separate entries:
#   gtf            = compressed (.gtf.gz) for lnc-seeker
#   gtf_stringtie  = uncompressed (.gtf) for StringTie / gene region resolution

stringtie=/path/to/stringtie
gtf=/path/to/refseq/annotation.gtf.gz
gtf_stringtie=/path/to/refseq/annotation.gtf
gtf_gencode=/path/to/gencode/lncrna.gtf.gz
genome=/path/to/genome.fa
output_dir=/path/to/output_directory
cache_dir=/path/to/lncseeker_cache
assembly_report_path=/path/to/assembly_report.txt

# Gene region(s): gene_name:padding_bp
gene_region=MALAT1:500
gene_region=PCA3:500
gene_region=CD44:500

# BAM files to include in the cohort
bam=/path/to/sample1.bam
bam=/path/to/sample2.bam
bam=/path/to/sample3.bam
