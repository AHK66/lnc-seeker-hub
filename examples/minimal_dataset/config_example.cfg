# lnc-seeker-collect — minimal example configuration
#
# Runs the cache-collection step on the three bundled GSE235167 samples
# across the six loci used in Supplementary Note 6.
#
# All paths below are relative to THIS file's directory. run_example.sh
# cd's into this directory before invoking the binary, so the relative
# paths resolve regardless of where you call it from.
#
# No reference genome is required: `genome` is optional and omitted here.
# The cache is simply built without per-read mismatch information.

# --- Reference files ---
gtf=annotation.gtf.gz
assembly_report=assembly_report.txt
# genome=                       # optional; leave unset to skip mismatch indexing

# --- Output ---
output_dir=collect_output

# --- Regions of interest (the six Note-6 loci, 500 bp flanking padding) ---
# Names are resolved to coordinates from the GTF (mapped to BAM names via
# the assembly report). One line per gene: the comma syntax (e.g.
# gene_region=GENE1,GENE2:500) spans a single region and requires all
# listed genes to lie on the same chromosome, so each locus is listed here.
gene_region=ACTB:500
gene_region=PCA3:500
gene_region=CD44:500
gene_region=MALAT1:500
gene_region=GAPDH:500
gene_region=TP53:500

# --- Behaviour (kept at the tool's safe defaults) ---
skip_secondary=true
stream=true

# --- Cohort: three GSE235167 PDX breast-cancer samples (~300 bp PE) ---
# A subset of the 20 PDX samples used in Supplementary Note 6, spanning the
# two molecular subtypes and primary/metastatic tissue sites:
#   SRR24952131  Basal-like TNBC, mammary tumor, untreated
#   SRR24952181  ER+,             mammary tumor, estrogen
#   SRR24952121  Basal-like TNBC, lung metastasis, untreated
[cohort:GSE235167]
tissue=breast
status=cancer
bam=bam/SRR24952131_Aligned.sortedByCoord.out.bam
bam=bam/SRR24952181_Aligned.sortedByCoord.out.bam
bam=bam/SRR24952121_Aligned.sortedByCoord.out.bam
