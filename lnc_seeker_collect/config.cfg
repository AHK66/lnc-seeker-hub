# lnc-seeker-collect Configuration Template
# This file defines the parameters for extracting and processing BAM files based on regions of interest.

# --- Global Reference Paths ---

# (Required) Path to the reference GTF file. Supports GZipped files.
gtf=/path/to/reference/annotation.gtf.gz

# (Required) Path to the NCBI/RefSeq assembly report mapping sequence names to accessions.
assembly_report=/path/to/reference/assembly_report.txt

# (Optional) Path to the reference genome FASTA file. 
# Providing this enables mismatch information in compact storage.
genome=/path/to/reference/genome.fa

# --- Output and Path Management ---

# Global directory where all outputs (collected BAMs, dictionary.json) will be saved.
output_dir=/path/to/output_directory

# (Optional) A prefix that will be prepended to all BAM paths defined in cohort sections.
# Useful for switching between local and remote storage paths.
# path_prefix=/data/projects/bam_storage/

# --- Pipeline Behavior ---

# (Boolean) If enabled, adds an 'EP:Z:' tag to records indicating if their start/end fall within extraction regions.
annotate_endpoint_tag=false

# (Boolean) Enables incremental streaming to reduce memory usage (experimental).
# If omitted, streaming is enabled by default. Set to 'false' to use traditional batch mode.
stream=true

# (Boolean) If enabled, secondary alignments (flag 0x100) are ignored during extraction.
skip_secondary=true

# (Boolean) Whether to write output BAM files for each cohort.
write_bam=true

# --- Header Compression (Experimental) ---

# (Boolean) Enables differential header compression for read names in the output.
# Significantly reduces disk footprint for localized regions like introns.
compress_headers=true

# Algorithm for header compression: 'huffman' (default), 'zstd', or 'delta'.
header_compression_algorithm=huffman

# (Boolean) Whether to use the 'Substitute' operation in differential compression.
# Set to 'false' to shrink the Huffman alphabet and improve performance on low-complexity names.
header_compression_use_substitutes=true

# (Boolean) Enables incremental delta-encoding during read collection.
# Highly recommended for large cohorts to avoid memory peaks.
use_delta_incremental_collection=true

# --- Region Specifications ---

# (Repeatable) Manually specify a genomic range to extract in the format chrom:start-end.
region=chr1:1000000-2000000

# (Repeatable) Automatically compute a region spanning one or more genes plus an optional offset in bp.
# Format: GeneName1,GeneName2[:offset]
gene_region=FAM72A,SRGAP2:5000
gene_region=FAM72B:2000

# --- Modular Configuration ---

# (Optional) Include another configuration file. Paths are relative to this file.
# include=shared_regions.cfg

# --- Cohort Definitions ---

# Defines a group of samples. The name 'Tumor' will be used for the output filename unless overridden.
[cohort:Tumor]
# Descriptive metadata
tissue=kidney
status=tumor
# (Repeatable) Paths to input BAM files for this cohort.
bam=/path/to/data/tumor_sample_1.bam
bam=/path/to/data/tumor_sample_2.bam
# (Optional) Override the default output path (output_dir/Tumor.bam)
# output_bam=/custom/path/to/Tumor_results.bam

[cohort:Normal]
tissue=kidney
status=normal
# If path_prefix was set above, these paths would be appended to it.
bam=/path/to/data/normal_sample_1.bam
