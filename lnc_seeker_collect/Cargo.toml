[package]
name = "lnc-seeker-collect"
version = "0.1.0"
edition = "2024"
description = "CLI for collecting RNA-seq BAM subsets and generating lnc-seeker caches"
license = "Apache-2.0"
authors = ["Arne Kutzner", "Pok-Son Kim"]
readme = "../README.md"
repository = "https://github.com/AHK66/lnc-seeker-hub"
homepage = "https://github.com/AHK66/lnc-seeker-hub"
keywords = ["bioinformatics", "lncrna", "rna-seq", "cli"]
categories = ["science", "command-line-utilities"]

[dependencies]
noodles = { version = "0.102.0", features = ["bam", "sam", "gtf", "csi", "bgzf", "core", "gff"] }
lnc_seeker_lib = { path = "../lnc_seeker_lib" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.5.31", features = ["derive"] }
