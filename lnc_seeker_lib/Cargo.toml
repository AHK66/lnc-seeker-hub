[package]
name = "lnc_seeker_lib"
version = "0.1.0"
edition = "2024"
description = "Rust core for lncRNA splice junction and coverage analysis used by lnc-seeker"
license = "Apache-2.0"
authors = ["Arne Kutzner", "Pok-Son Kim"]
readme = "../README.md"
repository = "https://github.com/AHK66/lnc-seeker-hub"
homepage = "https://github.com/AHK66/lnc-seeker-hub"
keywords = ["bioinformatics", "lncrna", "rna-seq", "rust"]
categories = ["science"]

[dependencies]
noodles = { version = "0.102.0", features = ["bam", "sam", "gtf", "fasta", "bgzf", "csi", "core", "gff"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
zstd = "0.13"
flate2 = "1.0"
rayon = "1.10"
clap = { version = "4.0", features = ["derive"] }
pyo3 = { version = "0.21", features = ["extension-module"] }

[lib]
name = "lnc_seeker_lib"
crate-type = ["cdylib", "rlib"]
